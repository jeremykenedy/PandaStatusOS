<!-- is-waiting from the first paint: the device has said nothing yet, and
     the class is what shows the waiting banner and holds the light controls
     inert until it has. ws_recv takes it off when the first state document
     lands; nothing ever puts it back, because the page only loads once.

     No theme class here. Auto is the resting state and Auto is no class at
     all, so a page loaded on a machine set to light paints light from the
     first frame instead of flashing dark and correcting itself. -->
<body class="is-waiting">
<!-- The theme is painted here, before anything else in the body is parsed,
     because the module that owns it runs at the end of the document and the
     page had already been painted in the other theme by then: a reload
     flashed dark before settling on light. Light is the default; `auto`
     follows the machine. The module below is still the owner of the
     preference, this only gets the first paint right. -->
<script>
  (function () {
    var pref = 'light';
    try { var v = localStorage.getItem('ps_theme');
          if (v === 'auto' || v === 'light' || v === 'dark') pref = v; } catch (e) {}
    var cls = pref;
    if (pref === 'auto') {
      cls = '';
      try { if (window.matchMedia('(prefers-color-scheme: dark)').matches) cls = 'dark';
            else cls = 'light'; } catch (e) {}
    }
    if (cls) document.body.classList.add(cls);
  })();
</script>

<!-- ══════════════════════════════════════════════════════════════════════
     Top bar. The device's own name, the wordmark, and what the printer is
     doing. The progress line under it is the same number as the chip,
     said in a way you can read from across the room.
     ══════════════════════════════════════════════════════════════════ -->
<header class="fixed surface-container" id="ps-top-bar">
  <nav class="ux_top_bar_row">
    <span class="small-text ux_top_name" id="ps-top-name"></span>
    <span class="max"></span>

    <!-- The product, in the middle. The left of the bar carries whatever
         the owner named THIS unit, which on a bench with two of them is the
         useful thing to see; this says what the software is, which the
         device name stops saying the moment it is renamed.

         Centred on the BAR rather than between its neighbours, so it does
         not shuffle sideways every time the state pill grows a percentage.

         Two marks, one per theme, both always in the DOM: swapping a src
         would refetch, and a data: URL that has already been decoded is
         cheaper to hide than to decode again. -->
    <span class="ux_top_brand l" id="ps-top-brand">
      <img class="ux_top_mark ux_mark_light" id="ps-top-mark" alt="" src="__MARKLIGHT__">
      <img class="ux_top_mark ux_mark_dark" id="ps-top-mark-dark" alt="" src="__MARKDARK__">
      <span data-no-translate data-str="ui_pandastatusos">PandaStatusOS</span>
    </span>

    <button class="chip fill" id="ps-top-pill">
      <svg class="i small" id="ps-top-dot"><use href="#i-printer-enclosed"/></svg>
      <span id="ps-top-state"></span>
      <span id="ps-top-pct"></span>
    </button>

    <!-- The one-tap theme cycle: auto, light, dark. Its icon says which is
         active, so it is a readout as much as a control. Sits after the
         pill, on the right, on every width. -->
    <button class="circle transparent ux_top_theme" id="ps-top-theme"
            title="Theme" data-str-title="ui_theme">
      <svg class="i" id="ps-top-theme-icon"><use href="#i-theme"/></svg>
    </button>
  </nav>
  <progress id="ps-top-prog" value="95" max="100"></progress>
  <span id="ps-top-prog-fill" hidden></span>
</header>
