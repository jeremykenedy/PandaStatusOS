<body class="ps-waiting">
<script>
/* First paint. Runs before any content so a reload never flashes the wrong theme. Beer CSS
   reads the theme class on <body>, not <html>; a class on <html> gave the sibling project a
   light theme nobody could reach. "auto" means no class: Beer follows prefers-color-scheme. */
(function () {
  var t = null;
  try { t = localStorage.getItem('ps_theme'); } catch (e) {}
  if (t === 'dark' || t === 'light') document.body.classList.add(t);
  else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) document.body.classList.add('dark');
  else document.body.classList.add('light');
})();
</script>
