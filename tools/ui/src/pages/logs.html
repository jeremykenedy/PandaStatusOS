<article data-ps-card id="ps-card-logs" hidden>
  <h2 class="ps-card-title" data-ps-str="ps_logs_title">Logs</h2>

  <div class="ps-tile" id="ps-logs-tile">
    <div class="ps-row">
      <span class="ps-tile-label" id="ps-logs-count" data-ps-no-i18n>—</span>
      <span class="max"></span>
      <button class="border small" id="ps-logs-copy" data-ps-str="ps_logs_copy">Copy</button>
      <button class="border small" id="ps-logs-clear" data-ps-str="ps_logs_clear">Clear</button>
    </div>
    <pre class="ps-logs" id="ps-logs-list" data-ps-no-i18n></pre>
    <div class="ps-tile-label" data-ps-str="ps_logs_help">What this page and the device said to each other since the page loaded, newest first. Kept in this browser only; the device keeps no log. Passwords and access codes are replaced by their length before they reach this list.</div>
  </div>
</article>
