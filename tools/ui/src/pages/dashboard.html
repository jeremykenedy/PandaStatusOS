<article data-ps-card id="ps-card-dashboard">
  <h2 class="ps-card-title" data-ps-str="ps_dashboard_title">Dashboard</h2>

  <div class="ps-grid ps-grid-2 ps-needs-state">

    <div class="ps-tile" id="ps-dashboard-printer">
      <div class="ps-row ps-tile-head"><svg class="ps-icon ps-icon-sm"><use href="#ps-icon-printer-enclosed"/></svg><div class="ps-tile-label" data-ps-str="ps_dashboard_printer">Printer</div></div>
      <div class="ps-row">
        <span class="ps-dot" id="ps-dashboard-printer-dot"></span>
        <span class="ps-tile-value ps-unset" id="ps-dashboard-printer-name" data-ps-no-i18n>—</span>
      </div>
      <div class="ps-tile-label" id="ps-dashboard-printer-state" data-ps-no-i18n>—</div>
    </div>

    <div class="ps-tile" id="ps-dashboard-network">
      <div class="ps-row ps-tile-head"><svg class="ps-icon ps-icon-sm"><use href="#ps-icon-wifi"/></svg><div class="ps-tile-label" data-ps-str="ps_dashboard_network">Network</div></div>
      <div class="ps-row">
        <span class="ps-dot" id="ps-dashboard-network-dot"></span>
        <span class="ps-tile-value ps-unset" id="ps-dashboard-hostname" data-ps-no-i18n>—</span>
      </div>
      <div class="ps-tile-label" id="ps-dashboard-network-state" data-ps-no-i18n>—</div>
    </div>

    <div class="ps-tile" id="ps-dashboard-lighting">
      <div class="ps-row ps-tile-head"><svg class="ps-icon ps-icon-sm"><use href="#ps-icon-light-bulb"/></svg><div class="ps-tile-label" data-ps-str="ps_dashboard_lighting">Lighting</div></div>
      <div class="ps-tile-value ps-unset" id="ps-dashboard-mode" data-ps-no-i18n>—</div>
      <div class="ps-tile-label" id="ps-dashboard-brightness" data-ps-no-i18n>—</div>
    </div>

    <div class="ps-tile" id="ps-dashboard-device">
      <div class="ps-row ps-tile-head"><svg class="ps-icon ps-icon-sm"><use href="#ps-icon-cog-6-tooth"/></svg><div class="ps-tile-label" data-ps-str="ps_dashboard_device">Device</div></div>
      <div class="ps-tile-value ps-unset" id="ps-dashboard-fw" data-ps-no-i18n>—</div>
      <div class="ps-tile-label" id="ps-dashboard-hotspot" data-ps-no-i18n>—</div>
    </div>

  </div>
</article>
