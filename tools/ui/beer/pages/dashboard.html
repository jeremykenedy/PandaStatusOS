<!-- ══════════════════════════════════════════════════════════════════════
     DASHBOARD
     What this device is doing, what the printer is doing, and the one control
     anyone opens this page to use. Every panel is a self-contained card,
     titled inside, so the page can lay them out as a wall.
     ══════════════════════════════════════════════════════════════════ -->
<section id="ps-card-status" data-card>

  <!-- ── The vent ─────────────────────────────────────────────────── -->
  <!-- The vent card that stood here is gone. This product has no flap, no servo and no
       airflow to show, and a dashboard that reports hardware the device does not have is
       worse than one that says nothing. Pairing a Panda Status with a Panda Vent so that
       one drives the other is a real idea and it is catalogued as a feature behind a flag
       that defaults off: docs/PANDAVENT-BRIDGE.md and docs/FEATURES.md. Rule 5. -->

  <!-- ── The print ────────────────────────────────────────────────── -->
  <article class="span-all">
    <h6 class="card-title" data-str="ui_current_print">Current print</h6>
    <nav>
      <span class="max" id="ps-job-name"></span>
      <span id="ps-job-pct"></span>
    </nav>
    <div class="space"></div>
    <progress id="ps-job-fill" value="0" max="100"></progress>
    <div class="space"></div>
    <nav class="small-text" id="ps-job-meta">
    </nav>
  </article>

  <!-- ── The printer ──────────────────────────────────────────────── -->
  <article class="no-padding">
    <h6 class="card-title" data-str="ui_printer">Printer</h6>
    <ul class="list border" id="ps-kv-printer"></ul>
  </article>

  <!-- ── Lighting, as it is right now ─────────────────────────────── -->
  <article class="no-padding" id="ps-lighting-row">
    <h6 class="card-title" data-str="status_lighting">Lighting now</h6>
    <ul class="list border" id="ps-kv-lighting"></ul>
  </article>

  <!-- ══════════════════════════════════════════════════════════════════
       THE AMS
       One chip per spool the printer describes, and the unit's own two
       readings above them. The whole card goes away when the printer has
       described no spools, which is what a machine with no AMS does.

       Humidity is a LEVEL, one to five. The printer publishes no mapping
       from that to a relative humidity and one owner measured ten percent
       against a reported five, so it is drawn as the level it is. A
       percentage here would be a number this project made up.
       ══════════════════════════════════════════════════════════════ -->
  <article class="no-padding" id="ps-card-ams">
    <h6 class="card-title" data-str="ui_ams">AMS</h6>
    <ul class="list border" id="ps-ams-kv"></ul>
    <div class="small-text padding no-padding-top" id="ps-ams-note" hidden></div>
    <div class="padding" id="ps-trays" hidden>
      <nav class="trays-grid" id="ps-trays-row"></nav>
    </div>
  </article>

  <!-- ── The vent, when there is one ──────────────────────────────────
       Not drawn at all while no vent is bound, the way the AMS card is not
       drawn when the printer describes no AMS. Everything in it is the vent's
       own report and nothing is invented: a row whose value the vent has not
       sent is not in the card.

       Status, not control. What the vent is told to do is on its own page
       (docs/PANDAVENT-BRIDGE.md, "A page for the vent's own settings"). -->
  <article id="ps-card-vent-status" hidden>
    <h6 class="card-title" data-str="ui_vent">Vent</h6>
    <ul class="list border">
      <li>
        <svg class="i"><use href="#i-vent-auto"/></svg>
        <div class="max" data-str="ui_state">State</div>
        <span class="small-text" id="ps-vs-state"></span>
      </li>
      <li id="ps-vs-chamber-row" hidden>
        <svg class="i"><use href="#i-temp"/></svg>
        <div class="max" data-str="ui_chamber">Chamber</div>
        <span class="small-text" id="ps-vs-chamber"></span>
      </li>
      <li id="ps-vs-policy-row" hidden>
        <svg class="i"><use href="#i-material"/></svg>
        <div class="max" data-str="ui_policy">Policy</div>
        <span class="small-text" id="ps-vs-policy"></span>
      </li>
      <li id="ps-vs-error-row" hidden>
        <svg class="i"><use href="#i-warning"/></svg>
        <div class="max" data-str="status_fault_code">Fault code</div>
        <span class="small-text" id="ps-vs-error"></span>
      </li>
    </ul>
  </article>

  <!-- ── Reaching back to the printer ─────────────────────────────── -->
  <article class="no-padding" id="ps-card-pctl">
    <h6 class="card-title" data-str="pctl_title">Printer controls</h6>
    <ul class="list border">
      <!-- Neither switch carries `checked`: a switch that starts on and is only corrected
           when the printer speaks is a switch that lies for as long as the printer is
           quiet. Both rows stay away until the printer has actually named that light. -->
      <li id="ps-pctl-chamber-light-row" hidden>
        <svg class="i"><use href="#i-lighting"/></svg>
        <div class="max" data-str="status_chamber_light" id="lbl-pctl-chamber-light">Chamber light</div>
        <label class="switch"><input type="checkbox" id="ps-pctl-chamber-light" aria-labelledby="lbl-pctl-chamber-light"><span></span></label>
      </li>

    </ul>
    <!-- The lamp is the only control here, on purpose. Three fan sliders and a four-level
         speed control sat under it for one day and the printer answered every one of them
         with "mqtt message verify failed": on this firmware the fans and the speed are signed
         commands, the lamp is not, and this device signs nothing (D-052 to D-054). The fan
         speeds and the running level are still shown, as readings, on the printer card and
         the job strip. -->
  </article>


  <!-- Two cards were here and are gone. The AMS spool chips need a model of the
       printer's trays that this device never builds, and the endstop check drives a flap
       this device does not have: both came over with the vent's markup and both drew an
       empty box on every dashboard. A card that can never fill is worse than no card. -->

</section>
